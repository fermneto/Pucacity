<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>PucaCity</title>
    <style>
      html, body { margin: 0; height: 100%; background: #000; overflow: hidden; }
      canvas { display: block; width: 100%; height: 100%; image-rendering: pixelated; }
      #hud {
        position: fixed; top: 8px; left: 8px;
        font: 12px/1.4 monospace; color: #e8e0c8;
        background: rgba(10, 10, 20, 0.75); border: 2px solid #5a5a7a;
        padding: 6px 10px; white-space: pre; pointer-events: none;
      }
      #error {
        position: fixed; inset: 0; display: none; padding: 24px;
        font: 14px/1.5 monospace; color: #ff8080; background: #100;
        white-space: pre-wrap; overflow: auto;
      }
    </style>
  </head>
  <body>
    <div id="hud"></div>
    <div id="error"></div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
